apiVersion: gateway.kyma-project.io/v1alpha1
kind: APIRule
metadata:
  name: sap-datasphere-mcp
  namespace: datasphere-mcp-v2
spec:
  gateway: kyma-gateway.kyma-system.svc.cluster.local
  host: datasphere-mcp-v2.YOUR_CLUSTER_DOMAIN
  rules:
    - path: /mcp
      accessStrategies:
        - handler: noop
      methods:
        - POST
        - GET
        - DELETE
        - OPTIONS
    - path: /health
      accessStrategies:
        - handler: noop
      methods:
        - GET
        - OPTIONS
  service:
    name: sap-datasphere-mcp
    port: 8080
