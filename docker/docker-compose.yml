services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # 9090 external to avoid conflict with local 8080 (MPL Explorer), container still uses 8080 internally
      - "9090:8080"
      - "9100:8100"
    env_file:
      - ../.env
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - ABAP_PARSER_URL=http://localhost:8100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
